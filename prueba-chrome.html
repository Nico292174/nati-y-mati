<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Prueba 2: abrir en Chrome</title>
<style>
  body { margin: 0; padding: 20px 16px; background: #FBF5EB; color: #3A3029; font: 16px/1.5 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 14px; }
  a.b { display: block; margin: 0 0 12px; padding: 14px 16px; border-radius: 12px; background: #B7C2A4; color: #3B4A2E; text-decoration: none; font-weight: 600; }
  a.b small { display: block; font-weight: 400; font-size: 12px; margin-top: 4px; word-break: break-all; opacity: .8; }
</style>
</head>
<body>
<h1>Prueba 2: abrir la invitación en Chrome</h1>
<p>Tocá cada botón, uno por vez, y anotá cuál abre la invitación <b>dentro de Chrome</b>. Volvé acá con "atrás" entre uno y otro.</p>
<div id="botones"></div>
<script>
(function () {
  var destino = 'https://nico292174.github.io/nati-y-mati/';
  var sinEsquema = destino.replace(/^https:\/\//, '');
  var despachador = 'com.android.chrome/com.google.android.apps.chrome.IntentDispatcher';
  var variantes = [
    ['A · intent a la puerta que recibe direcciones (component = IntentDispatcher)',
      'intent://' + sinEsquema + '#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;component=' + despachador + ';end'],
    ['B · intent con el esquema propio de Chrome (googlechrome://navigate)',
      'intent://navigate?url=' + encodeURIComponent(destino) + '#Intent;scheme=googlechrome;package=com.android.chrome;end'],
    ['C · B + component = IntentDispatcher',
      'intent://navigate?url=' + encodeURIComponent(destino) + '#Intent;scheme=googlechrome;action=android.intent.action.VIEW;component=' + despachador + ';end'],
    ['D · intent https con package y component a la vez',
      'intent://' + sinEsquema + '#Intent;scheme=https;package=com.android.chrome;component=' + despachador + ';end'],
    ['E · dirección android-app:// de Chrome',
      'android-app://com.android.chrome/https/' + sinEsquema],
    ['F · control: la forma simple que ya probaste (abre Chrome vacío)',
      'intent://' + sinEsquema + '#Intent;scheme=https;package=com.android.chrome;end']
  ];
  var cont = document.getElementById('botones');
  variantes.forEach(function (v) {
    var a = document.createElement('a'); a.className = 'b'; a.href = v[1];
    a.innerHTML = v[0] + '<small></small>'; a.querySelector('small').textContent = v[1];
    cont.appendChild(a);
  });
})();
</script>
</body>
</html>
